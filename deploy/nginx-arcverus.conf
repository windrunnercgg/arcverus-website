# ArcVerus — nginx config (final, with SSL)
# Installed as /etc/nginx/sites-available/www-arcverus (symlinked in sites-enabled).
# Named "www-..." so it loads AFTER the cgg-* files: nginx uses the first-loaded site as the
# fallback for unknown hostnames, and that should stay CGG. No ipv6only=on here (CGG sets it;
# it may appear only once per port). No http2 (on nginx 1.24 it would switch CGG to HTTP/2 too).
# Main address: https://www.arcverus.com. Every other name and http:// redirects there.
# Shares the server (and its IP) with CGG. nginx picks the site by domain name.

# --- http:// (all names) → https://www.arcverus.com ---
server {
    listen 80;
    listen [::]:80;
    server_name www.arcverus.com arcverus.com www.arcverus.net arcverus.net;
    return 301 https://www.arcverus.com$request_uri;
}

# --- https:// on the other names → https://www.arcverus.com ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arcverus.com www.arcverus.net arcverus.net;

    ssl_certificate     /etc/letsencrypt/live/arcverus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcverus/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.arcverus.com$request_uri;
}

# --- The site: https://www.arcverus.com ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.arcverus.com;

    ssl_certificate     /etc/letsencrypt/live/arcverus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcverus/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/arcverus/site;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compress text files
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages, CSS and JS: browsers re-check for changes on every visit (fast, using ETags),
    # so a deploy shows up immediately.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fonts and images rarely change: cache them for 30 days
    location ~* \.(?:woff2|svg|webp|png|jpg|jpeg|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Contact form API (enabled later, when the form goes live)
    # location /api/ {
    #     proxy_pass http://127.0.0.1:PORT;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
